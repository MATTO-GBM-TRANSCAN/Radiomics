[metadata]
name = matto_radiomics
description = The MATTO-GBM radiomics pipeline (feature extraction, model development and inference) as a single installable package.
version = 0.1.0

[options]
# matto_radiomics itself is just __init__.py, right here next to setup.cfg (completely normal).
# Every other piece of the pipeline is mapped in from where it physically lives, so that
# Radiomic_Feature_Extraction and Radiomics_Model_Development install
# as ONE package, matto_radiomics, without moving any code out of the place it's actually worked on:
#   matto_radiomics.feature_extraction       -> Radiomic_Feature_Extraction/code/
#   matto_radiomics.models                   -> Radiomics_Model_Development/code/models/
#   matto_radiomics.feature_selection        -> Radiomics_Model_Development/code/feature_selection/
#   matto_radiomics.train_val_test           -> Radiomics_Model_Development/code/train_val_test/
#   matto_radiomics.data_preparation         -> Radiomics_Model_Development/code/data_preparation/
#   matto_radiomics.utils                    -> 0_Common/
# Only the installed *names* of matto_radiomics.models and matto_radiomics.feature_selection
# have to stay stable (trained .pkl files depend on them) -- none of the others carry that
# constraint, they're mapped in here purely for a single, consistent package identity.
#
# NOTE: this does NOT make `pip install -e 0_Packaging` install Radiomic_Feature_Extraction's own
# dependencies (numpy, SimpleITK, pyradiomics) -- pyradiomics needs a special install
# sequence (numpy first, then `pip install pyradiomics==3.0.1 --no-build-isolation`,
# then a manual file patch) that can't be expressed as a normal install_requires entry
# without breaking that sequence. Docker already runs that exact sequence for you
# (see the Dockerfile), which is why it's the only installation path this repository
# documents.
package_dir =
    matto_radiomics = .
    matto_radiomics.models = ../Radiomics_Model_Development/code/models
    matto_radiomics.feature_selection = ../Radiomics_Model_Development/code/feature_selection
    matto_radiomics.utils = ../0_Common
    matto_radiomics.train_val_test = ../Radiomics_Model_Development/code/train_val_test
    matto_radiomics.data_preparation = ../Radiomics_Model_Development/code/data_preparation
    matto_radiomics.feature_extraction = ../Radiomic_Feature_Extraction/code
packages =
    matto_radiomics
    matto_radiomics.models
    matto_radiomics.feature_selection
    matto_radiomics.utils
    matto_radiomics.train_val_test
    matto_radiomics.data_preparation
    matto_radiomics.feature_extraction
install_requires =
    lifelines
    onnxruntime
    openpyxl
    pandas
    # Pinned: the AR models published on Zenodo were trained with scikit-learn
    # 1.8.0. A pickled model is not guaranteed to load correctly with a
    # different scikit-learn version, and this has been confirmed to break in
    # practice (loading fails with an AttributeError on an older version).
    scikit-learn==1.8.0
    skl2onnx
    statsmodels
